<div class="post-share">
  <div class="post-date">
    {{ site.data.settings.sharing_button_prompt }}
  </div>

  <div class="sharing-icons">
    <a
      href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ site.baseurl }}{{ page.url }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Share on LinkedIn"
    >
      <i class="fa fa-linkedin" aria-hidden="true"></i>
    </a>

    <a
      href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Share on Facebook"
    >
      <i class="fa fa-facebook" aria-hidden="true"></i>
    </a>
  </div>
</div>
